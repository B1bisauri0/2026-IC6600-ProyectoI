# dsm.conf - idéntico en las 3 computadoras del laboratorio
# Reemplazar las IP por las reales de cada computadora.
page_size=4096
node_mem_mb=512
max_nodes=3
va_slab_mb=2048
base_addr=0x200000000000
peers=10.0.0.11:27000,10.0.0.12:27000,10.0.0.13:27000
port_range=27000-27099
heartbeat_ms=1000
heartbeat_miss_max=3
connect_timeout_ms=2000
request_timeout_ms=5000
cache_max_pages=24000
worker_threads=1
max_user_threads=64
log_level=info
replication_factor=1
replacement=fifo