# ==============================================================================
# dsm.conf -- Archivo de configuracion del sistema DSM
# Documento de Diseno: Seccion 6 (Formato de dsm.conf)
# ==============================================================================

# Tamano de pagina DSM en bytes.
# Debe ser potencia de 2 y multiplo del tamano de pagina del SO (ej. 4096, 8192, 16384, 65536).
# Valor predeterminado: 4096.
page_size=4096

# Memoria aportada por este nodo en MiB (memoria fisica respaldada).
node_mem_mb=512

# Numero maximo de nodos soportados en el cluster (hasta 8).
max_nodes=3

# Tamano de la franja virtual por nodo en MiB.
va_slab_mb=2048

# Direccion base virtual donde se mapea la ventana DSM identica en todos los nodos.
base_addr=0x200000000000

# Lista de pares (peers) en orden de node_id: host:puerto_base
peers=127.0.0.1:27000,127.0.0.1:27010,127.0.0.1:27020

# Rango de puertos TCP
port_range=27000-27099

# Intervalo y umbral de fallos para latidos (heartbeat)
heartbeat_ms=1000
heartbeat_miss_max=3

# Timeouts en milisegundos para conexion y solicitudes
connect_timeout_ms=2000
request_timeout_ms=5000

# Limite de paginas en la cache remota local (antes de iniciar desalojos)
cache_max_pages=24000

# Politica de reemplazo de paginas remotas: fifo o clock (segunda oportunidad)
# Valor predeterminado: fifo
# El Prototipo 1 usa FIFO; clock se activa en el Prototipo 2
replacement=fifo

# Hilos de atencion de red y limite de hilos de usuario registrados
worker_threads=4
max_user_threads=64

# Nivel de registro (debug, info, warn, error)
log_level=info

# Factor de replicacion para tolerancia a fallos (1 = sin replicas, 2 = con replica)
replication_factor=1

